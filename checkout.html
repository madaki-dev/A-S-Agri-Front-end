<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — A&amp;S Agri</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body data-root-prefix="">
  <header id="navbar"></header>

  <main>
    <section class="page-hero">
      <div class="container">
        <h1>Checkout</h1>
        <p class="lede mb-0">Confirm your delivery details to complete your order.</p>
      </div>
    </section>

    <section class="section--tight">
      <div class="container">
        <div class="split-panel" style="align-items:flex-start;grid-template-columns:1.3fr 1fr">
          <form id="checkout-form" class="card" novalidate>
            <h3>Delivery details</h3>
            <div class="field-row">
              <div class="field" id="f-fullname"><label for="fullname">Full name</label><input id="fullname"
                  class="input" required></div>
              <div class="field" id="f-phone"><label for="phone">Phone</label><input id="phone" class="input" required>
              </div>
            </div>
            <div class="field-row">
              <div class="field" id="f-whatsapp"><label for="whatsapp">WhatsApp number</label><input id="whatsapp"
                  class="input" required></div>
              <div class="field" id="f-state"><label for="state">State</label>
                <select id="state" class="input" required>
                  <option value="">Select state</option>
                </select>
              </div>
            </div>
            <div class="field" id="f-address"><label for="address">Delivery address</label><textarea id="address"
                class="input" required></textarea></div>
            <button type="submit" class="btn btn-primary btn-block" id="pay-btn">Continue to payment</button>
            <p class="hint text-center">You'll be redirected to Flutterwave to complete payment securely.</p>
          </form>

          <div class="card" id="summary-card">
            <h3>Order summary</h3>
            <div id="summary-body">Loading…</div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer id="footer"></footer>

  <script src="js/api.js"></script>
  <script src="js/extras.js"></script>
  <script src="js/ui.js"></script>
  <script>
    const user = requireAuth("", "Buyer");

    let CART = [];
    let SUBTOTAL = 0;
    let CURRENT_TRANSPORT = null;


    // --------------------------------------------------
    // BUILD CART PAYLOAD
    // --------------------------------------------------

    function getCartPayload() {

      return CART.map(item => ({
        productId:
          item.product?._id,

        quantity:
          Number(item.quantity)
      }));

    }


    // --------------------------------------------------
    // LOAD CART
    // --------------------------------------------------

    async function loadSummary() {

      const body =
        document.getElementById(
          "summary-body"
        );

      try {

        CART =
          await API.getCart();


        if (!CART.length) {

          body.innerHTML =
            emptyState(
              "Your cart is empty",
              "Add products before checking out."
            );

          document.getElementById(
            "pay-btn"
          ).disabled = true;

          return;
        }


        SUBTOTAL =
          CART.reduce(
            (sum, item) => {

              const price =
                Number(
                  item.product?.sellingPrice || 0
                );

              return (
                sum +
                price *
                Number(
                  item.quantity || 0
                )
              );

            },
            0
          );


        renderSummary();

      } catch (err) {

        body.innerHTML =
          emptyState(
            "Couldn't load your cart",
            err.message
          );

      }

    }


    // --------------------------------------------------
    // RENDER SUMMARY
    // --------------------------------------------------

    function renderSummary() {

      const body =
        document.getElementById(
          "summary-body"
        );


      body.innerHTML =

        CART
          .map(item => `

                    <div
                        class="flex-between"
                        style="margin-bottom:8px;font-size:.9rem"
                    >

                        <span>
                            ${escapeHtml(
            item.product?.productName ||
            "Product"
          )}

                            ×

                            ${item.quantity}
                        </span>

                        <span>
                            ${formatNaira(
            (
              Number(
                item.product?.sellingPrice || 0
              ) *
              Number(
                item.quantity || 0
              )
            )
          )}
                        </span>

                    </div>

                `)
          .join("")

        +

        `
                <div class="divider"></div>

                <div class="flex-between">
                    <span class="muted">
                        Subtotal
                    </span>

                    <strong>
                        ${formatNaira(SUBTOTAL)}
                    </strong>
                </div>

                <div
                    class="flex-between"
                    id="transport-row"
                >
                    <span class="muted">
                        Delivery
                    </span>

                    <span class="muted">
                        Select a state
                    </span>
                </div>

                <div class="divider"></div>

                <div
                    class="flex-between"
                    style="font-size:1.1rem"
                >
                    <strong>
                        Total
                    </strong>

                    <strong id="total-value">
                        ${formatNaira(SUBTOTAL)}
                    </strong>
                </div>
            `;

    }


    // --------------------------------------------------
    // LOAD DELIVERY STATES
    // --------------------------------------------------

    async function loadStates() {

      const select =
        document.getElementById(
          "state"
        );

      try {

        const states =
          await API.getTransportLocations();


        states.forEach(state => {

          const option =
            document.createElement(
              "option"
            );

          option.value =
            state;

          option.textContent =
            state;

          select.appendChild(
            option
          );

        });

      } catch (err) {

        toast(
          "Couldn't load delivery states.",
          "error"
        );

      }

    }


    // --------------------------------------------------
    // CALCULATE DELIVERY
    // --------------------------------------------------

    async function calculateDelivery(
      destination
    ) {

      const row =
        document.getElementById(
          "transport-row"
        );

      const total =
        document.getElementById(
          "total-value"
        );


      if (!destination) {

        CURRENT_TRANSPORT = null;


        if (row) {

          row.innerHTML =
            `
                        <span class="muted">
                            Delivery
                        </span>

                        <span class="muted">
                            Select a state
                        </span>
                    `;

        }


        if (total) {

          total.textContent =
            formatNaira(
              SUBTOTAL
            );

        }

        return;

      }


      /*
       * Make sure the cart still exists
       * before calculating transport.
       */

      if (!CART.length) {

        CURRENT_TRANSPORT = null;

        return;

      }


      if (row) {

        row.innerHTML =
          `
                    <span class="muted">
                        Delivery
                    </span>

                    <span class="muted">
                        Calculating…
                    </span>
                `;

      }


      try {

        const cart =
          getCartPayload();


        /*
         * Make sure every cart item has
         * a valid product ID and quantity.
         */

        if (
          cart.some(
            item =>
              !item.productId ||
              !Number.isInteger(
                item.quantity
              ) ||
              item.quantity <= 0
          )
        ) {

          throw new Error(
            "One or more cart items are invalid."
          );

        }


        const result =
          await API.calculateTransport({

            cart,

            destination

          });


        CURRENT_TRANSPORT =
          result;


        const fee =
          Number(
            result.transportFee || 0
          );


        if (
          !Number.isFinite(fee) ||
          fee < 0
        ) {

          throw new Error(
            "Invalid transport price returned."
          );

        }


        if (row) {

          row.innerHTML =
            `
                        <span class="muted">
                            Delivery
                        </span>

                        <span>
                            ${formatNaira(fee)}
                        </span>
                    `;

        }


        if (total) {

          total.textContent =
            formatNaira(
              SUBTOTAL + fee
            );

        }

      } catch (err) {

        CURRENT_TRANSPORT = null;


        if (row) {

          row.innerHTML =
            `
                        <span class="muted">
                            Delivery
                        </span>

                        <span
                            class="muted"
                            style="color:#b42318"
                        >
                            Unavailable
                        </span>
                    `;

        }


        if (total) {

          total.textContent =
            formatNaira(
              SUBTOTAL
            );

        }


        toast(
          err.message ||
          "Couldn't calculate delivery.",
          "error"
        );

      }

    }


    // --------------------------------------------------
    // STATE CHANGE
    // --------------------------------------------------

    document
      .getElementById("state")
      .addEventListener(
        "change",
        async (event) => {

          await calculateDelivery(
            event.target.value
          );

        }
      );


    // --------------------------------------------------
    // CHECKOUT
    // --------------------------------------------------

    document
      .getElementById(
        "checkout-form"
      )
      .addEventListener(
        "submit",
        async (event) => {

          event.preventDefault();


          const fullname =
            document
              .getElementById(
                "fullname"
              )
              .value
              .trim();


          const phone =
            document
              .getElementById(
                "phone"
              )
              .value
              .trim();


          const whatsapp =
            document
              .getElementById(
                "whatsapp"
              )
              .value
              .trim();


          const state =
            document
              .getElementById(
                "state"
              )
              .value;


          const address =
            document
              .getElementById(
                "address"
              )
              .value
              .trim();


          let ok = true;


          const check =
            (
              id,
              valid
            ) => {

              document
                .getElementById(id)
                .classList
                .toggle(
                  "has-error",
                  !valid
                );

              ok =
                ok &&
                valid;

            };


          check(
            "f-fullname",
            !!fullname
          );


          check(
            "f-phone",
            !!phone
          );


          check(
            "f-whatsapp",
            !!whatsapp
          );


          check(
            "f-state",
            !!state
          );


          check(
            "f-address",
            !!address
          );


          if (!ok) {

            toast(
              "Please complete every field.",
              "error"
            );

            return;

          }


          /*
           * Build the cart directly from the
           * current cart state.
           */

          const cart =
            getCartPayload();


          if (!cart.length) {

            toast(
              "Your cart is empty.",
              "error"
            );

            return;

          }


          /*
           * Require a valid transport calculation
           * before starting payment.
           */

          if (!CURRENT_TRANSPORT) {

            toast(
              "Please select your delivery state so we can calculate transport.",
              "error"
            );

            return;

          }


          /*
           * Re-check that the selected destination
           * still has a transport calculation.
           */

          if (
            CURRENT_TRANSPORT.destination &&
            CURRENT_TRANSPORT.destination !== state
          ) {

            toast(
              "Please recalculate delivery for your selected state.",
              "error"
            );

            await calculateDelivery(
              state
            );

            return;

          }


          const btn =
            document.getElementById(
              "pay-btn"
            );


          btn.disabled = true;

          btn.textContent =
            "Redirecting to payment…";


          try {

            /*
             * The backend independently recalculates
             * transport and product totals from MongoDB.
             *
             * The frontend transport result is only
             * for display and validation.
             */

            const res =
              await API.initializePayment({

                fullname,

                phone,

                whatsapp,

                state,

                address,

                cart

              });


            if (
              res.paymentLink
            ) {

              window.location.href =
                res.paymentLink;

            } else {

              throw new Error(
                "Payment link was not returned."
              );

            }

          } catch (err) {

            toast(
              err.message ||
              "Unable to initialize payment.",
              "error"
            );


            btn.disabled =
              false;

            btn.textContent =
              "Continue to payment";

          }

        }
      );


    // --------------------------------------------------
    // INIT
    // --------------------------------------------------

    if (user) {

      loadSummary();

      loadStates();

    }

  </script>
</body>

</html>
