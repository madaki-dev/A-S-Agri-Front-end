<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — A&amp;S Agri</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body data-root-prefix="../">
  <header id="navbar"></header>

  <div class="dash">
    <aside class="dash__sidebar" id="dash-sidebar"></aside>
    <div class="dash__main">
      <button class="btn btn-ghost btn-sm mobile-dash-toggle" onclick="toggleDashSidebar()"><span
          style="display:inline-flex;vertical-align:-3px;margin-right:6px"><svg viewBox="0 0 24 24" width="16"
            height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M4 7h16M4 12h16M4 17h16" />
          </svg></span>Menu</button>
      <div class="dash__head">
        <div>
          <h1>Admin overview</h1>
          <p class="muted mb-0">Platform-wide sales, orders, and seller verification.</p>
        </div>
      </div>

      <div class="pill-nav">
        <button class="active" data-tab="overview">Overview</button>
        <button data-tab="orders">All Orders</button>
        <button data-tab="sellers">Sellers</button>
        <button data-tab="transport">Transport</button>
      </div>

      <div id="tab-overview">
        <div class="skeleton" style="height:200px"></div>
      </div>
      <div id="tab-orders" style="display:none"></div>
      <div id="tab-sellers" style="display:none"></div>
      <div id="tab-transport" style="display:none"></div>
    </div>
  </div>

  <footer id="footer"></footer>

  <script src="../js/api.js"></script>
  <script src="../js/extras.js"></script>
  <script src="../js/ui.js"></script>
  <script>
    const user = requireAuth("../", "Admin");
    const SIDEBAR_LINKS = [{ href: "dashboard.html", label: "Admin dashboard" },
    { href: "admin-payouts.html", label: "Payouts" }];
    if (user) renderDashSidebar(SIDEBAR_LINKS, "dashboard.html", "");

    document
      .querySelectorAll(".pill-nav button")
      .forEach(btn => {

        btn.addEventListener(
          "click",
          async () => {

            document
              .querySelectorAll(
                ".pill-nav button"
              )
              .forEach(b =>
                b.classList.remove(
                  "active"
                )
              );

            btn.classList.add(
              "active"
            );


            const tabs = [
              "overview",
              "orders",
              "sellers",
              "transport"
            ];


            tabs.forEach(tab => {

              const element =
                document.getElementById(
                  "tab-" + tab
                );

              if (element) {

                element.style.display =
                  tab ===
                    btn.dataset.tab
                    ? "block"
                    : "none";

              }

            });


            if (
              btn.dataset.tab ===
              "transport"
            ) {

              await loadTransport();

            }

          }
        );

      });

    function statusBadge(status) { return `<span class="badge badge--status-${(status || "pending").toLowerCase()}">${status}</span>`; }

    async function loadOverview() {
      try {
        const data = await API.getAdminDashboard();
        document.getElementById("tab-overview").innerHTML = `
      <div class="stat-cards">
        <div class="stat-card"><div class="stat-card__label">Total sales</div><div class="stat-card__value">${formatNaira(data.totalSales)}</div></div>
        <div class="stat-card"><div class="stat-card__label">Total orders</div><div class="stat-card__value">${data.totalOrders}</div></div>
        <div class="stat-card"><div class="stat-card__label">Commission earned</div><div class="stat-card__value">${formatNaira(data.commissionEarned)}</div></div>
      </div>`;
      } catch (err) {
        document.getElementById("tab-overview").innerHTML = emptyState("Couldn't load overview", err.message);
      }
    }

    async function loadOrders() {

      const mount =
        document.getElementById("tab-orders");

      mount.innerHTML =
        `<div class="skeleton" style="height:260px"></div>`;

      try {

        const orders =
          await API.getAdminOrders();


        if (!orders || !orders.length) {

          mount.innerHTML =
            emptyState("No orders yet", "");

          return;
        }


        mount.innerHTML = `
          <div class="table-wrap">

            <table>

              <thead>
                <tr>
                  <th>Order</th>
                  <th>Buyer</th>
                  <th>Phone</th>
                  <th>WhatsApp</th>
                  <th>Products</th>
                  <th>Location</th>
                  <th>Total paid</th>
                  <th>Status</th>
                  <th>Date</th>
                </tr>
              </thead>

              <tbody>

                ${orders.map(o => {

          const orderId =
            o._id
              ? String(o._id).slice(-6).toUpperCase()
              : "N/A";


          /* ==============================
             BUYER DETAILS
             ============================== */

          const buyerName =
            o.delivery?.fullname ||
            o.buyer?.fullName ||
            "—";


          const phone =
            o.delivery?.phone ||
            o.buyer?.phone ||
            "—";


          const whatsapp =
            o.delivery?.whatsapp ||
            "—";


          const location = [
            o.delivery?.address,
            o.delivery?.state
          ]
            .filter(Boolean)
            .join(", ") || "—";


          /* ==============================
             PRODUCTS
             ============================== */

          const productNames =
            (o.products || [])
              .map(item => {

                const name =
                  item.product?.productName ||
                  "Unknown product";

                const quantity =
                  item.quantity || 0;

                return `
                          ${escapeHtml(name)}
                          × ${escapeHtml(quantity)}
                        `;
              })
              .join("<br>") || "—";


          /* ==============================
             TOTAL
             ============================== */

          const totalPaid =
            Number(o.totalAmount || 0);


          /* ==============================
             ROW
             ============================== */

          return `

                    <tr>

                      <td class="muted">
                        ${escapeHtml(orderId)}
                      </td>


                      <td>
                        ${escapeHtml(buyerName)}
                      </td>


                      <td>
                        ${escapeHtml(phone)}
                      </td>


                      <td>
                        ${escapeHtml(whatsapp)}
                      </td>


                      <td>
                        ${productNames}
                      </td>


                      <td>
                        ${escapeHtml(location)}
                      </td>


                      <td>
                        ${formatNaira(totalPaid)}
                      </td>


                      <td>
                        ${statusBadge(o.status)}
                      </td>


                      <td>
                        ${formatDate(o.createdAt)}
                      </td>

                    </tr>

                  `;

        }).join("")}

              </tbody>

            </table>

          </div>
        `;


      } catch (err) {

        console.error(
          "ADMIN ORDERS ERROR:",
          err
        );


        mount.innerHTML =
          emptyState(
            "Couldn't load orders",
            err.message
          );
      }
    }

    async function loadSellers() {
      const mount = document.getElementById("tab-sellers");
      mount.innerHTML = `<div class="skeleton" style="height:260px"></div>`;
      mount.innerHTML = `<p class="hint" style="margin-bottom:16px">Seller list is derived from current product listings — a dedicated sellers endpoint would make this more reliable. Verification is stored locally as a prototype stand-in until the backend supports a real \`verified\` field on User.</p>`;
      try {
        const products = await API.getProducts({ page: 1 });
        const sellers = {};
        products.forEach(p => {
          if (p.farmer) sellers[p.farmer._id] = sellers[p.farmer._id] || { ...p.farmer, count: 0 };
          if (p.farmer) sellers[p.farmer._id].count++;
        });
        const list = Object.values(sellers);
        if (!list.length) { mount.innerHTML += emptyState("No sellers yet", ""); return; }
        mount.innerHTML += `<div class="table-wrap"><table>
      <thead><tr><th>Seller</th><th>Phone</th><th>Products</th><th>Status</th><th></th></tr></thead>
      <tbody>${list.map(s => `
        <tr>
          <td>${escapeHtml(s.fullName)}</td>
          <td>${escapeHtml(s.phone || "")}</td>
          <td>${s.count}</td>
          <td id="status-${s._id}">${Extras.isVerified(s._id) ? `<span class="badge badge--verified">${ICONS.check} Verified</span>` : `<span class="badge badge--muted">Unverified</span>`}</td>
          <td><button class="icon-btn" data-toggle-verify="${s._id}">${Extras.isVerified(s._id) ? "Revoke" : "Verify"}</button></td>
        </tr>`).join("")}</tbody>
    </table></div>`;
        mount.querySelectorAll("[data-toggle-verify]").forEach(btn => {
          btn.addEventListener("click", () => {
            const id = btn.dataset.toggleVerify;
            const next = !Extras.isVerified(id);
            Extras.setVerified(id, next);
            toast(next ? "Seller verified." : "Verification revoked.");
            loadSellers();

            async function loadTransport() {

              const mount =
                document.getElementById(
                  "tab-transport"
                );


              mount.innerHTML =
                `<div class="skeleton" style="height:400px"></div>`;


              try {

                const [
                  settings,
                  routes
                ] = await Promise.all([

                  API.getTransportSettings(),

                  API.getTransportPrices()

                ]);


                mount.innerHTML = `

      <div
        class="card"
        style="margin-bottom:24px"
      >

        <div
          style="
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:16px;
            margin-bottom:20px;
          "
        >

          <div>

            <h3 style="margin:0">
              Transport settings
            </h3>

            <p
              class="muted"
              style="margin:4px 0 0"
            >
              Update fuel and transport calculation values.
            </p>

          </div>

        </div>


        <div
          class="field-row"
          style="margin-bottom:16px"
        >

          <div class="field">

            <label>
              Base diesel price
            </label>

            <input
              class="input"
              id="transport-base-diesel"
              type="number"
              min="0"
              value="${settings.baseDieselPrice}"
            >

          </div>


          <div class="field">

            <label>
              Current diesel price
            </label>

            <input
              class="input"
              id="transport-current-diesel"
              type="number"
              min="0"
              value="${settings.currentDieselPrice}"
            >

          </div>

        </div>


        <div
          class="field-row"
          style="margin-bottom:16px"
        >

          <div class="field">

            <label>
              Truck rate / tonne
            </label>

            <input
              class="input"
              id="transport-truck-rate"
              type="number"
              min="0"
              value="${settings.truckRatePerTonne}"
            >

          </div>


          <div class="field">

            <label>
              Fuel sensitivity
            </label>

            <input
              class="input"
              id="transport-fuel-sensitivity"
              type="number"
              min="0"
              max="1"
              step="0.01"
              value="${settings.fuelSensitivity}"
            >

          </div>

        </div>


        <div
          class="field-row"
          style="margin-bottom:20px"
        >

          <div class="field">

            <label>
              Intra-state / 10 bags
            </label>

            <input
              class="input"
              id="transport-intra-state"
              type="number"
              min="0"
              value="${settings.intraStatePerTenBags}"
            >

          </div>

        </div>


        <button
          class="btn btn-primary"
          id="save-transport-settings"
        >
          Save transport settings
        </button>

      </div>


      <div class="card">

        <div
          style="
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:16px;
            margin-bottom:20px;
          "
        >

          <div>

            <h3 style="margin:0">
              Route prices
            </h3>

            <p
              class="muted"
              style="margin:4px 0 0"
            >
              ${routes.length} directional routes
            </p>

          </div>

        </div>


        <div class="field" style="margin-bottom:16px">

          <label>
            Search routes
          </label>

          <input
            class="input"
            id="transport-route-search"
            placeholder="Search origin or destination..."
          >

        </div>


        <div
          class="table-wrap"
          style="max-height:650px;overflow:auto"
        >

          <table>

            <thead>

              <tr>

                <th>Origin</th>

                <th>Destination</th>

                <th>Base</th>

                <th>Current</th>

                <th>Travel time</th>

                <th></th>

              </tr>

            </thead>


            <tbody id="transport-routes-body"></tbody>

          </table>

        </div>

      </div>

    `;


                function renderRoutes(
                  search = ""
                ) {

                  const query =
                    search
                      .trim()
                      .toLowerCase();


                  const filtered =
                    routes.filter(route => {

                      if (!query) {
                        return true;
                      }

                      return (

                        String(
                          route.origin || ""
                        )
                          .toLowerCase()
                          .includes(query)

                        ||

                        String(
                          route.destination || ""
                        )
                          .toLowerCase()
                          .includes(query)

                      );

                    });


                  const body =
                    document.getElementById(
                      "transport-routes-body"
                    );


                  if (!filtered.length) {

                    body.innerHTML = `
          <tr>
            <td
              colspan="6"
              class="muted text-center"
            >
              No routes found.
            </td>
          </tr>
        `;

                    return;

                  }


                  body.innerHTML =
                    filtered
                      .map(route => `

            <tr>

              <td>
                ${escapeHtml(
                        route.origin
                      )}
              </td>

              <td>
                ${escapeHtml(
                        route.destination
                      )}
              </td>

              <td>
                ${formatNaira(
                        route.basePrice
                      )}
              </td>

              <td>
                <strong>
                  ${formatNaira(
                        route.currentPrice
                      )}
                </strong>
              </td>

              <td>
                ${escapeHtml(
                        route.travelTime ||
                        "—"
                      )}
              </td>

              <td>

                <button
                  class="icon-btn"
                  data-edit-transport="${route._id}"
                >
                  Edit
                </button>

              </td>

            </tr>

          `)
                      .join("");


                  body
                    .querySelectorAll(
                      "[data-edit-transport]"
                    )
                    .forEach(button => {

                      button.addEventListener(
                        "click",
                        async () => {

                          const id =
                            button.dataset
                              .editTransport;


                          const route =
                            routes.find(
                              r =>
                                String(
                                  r._id
                                ) ===
                                String(id)
                            );


                          if (!route) {
                            return;
                          }


                          const currentPrice =
                            window.prompt(
                              `Current price for ${route.origin} → ${route.destination}`,
                              route.currentPrice
                            );


                          if (
                            currentPrice ===
                            null
                          ) {

                            return;

                          }


                          const price =
                            Number(
                              currentPrice
                            );


                          if (
                            !Number.isFinite(price) ||
                            price < 0
                          ) {

                            toast(
                              "Enter a valid transport price.",
                              "error"
                            );

                            return;

                          }


                          try {

                            button.disabled =
                              true;

                            button.textContent =
                              "Saving…";


                            const result =
                              await API.updateTransportRoute(
                                route._id,
                                {
                                  currentPrice:
                                    price
                                }
                              );


                            const index =
                              routes.findIndex(
                                r =>
                                  String(
                                    r._id
                                  ) ===
                                  String(
                                    route._id
                                  )
                              );


                            if (index !== -1) {

                              routes[index] =
                                result.route;

                            }


                            renderRoutes(
                              document
                                .getElementById(
                                  "transport-route-search"
                                )
                                .value
                            );


                            toast(
                              "Route price updated."
                            );

                          } catch (err) {

                            toast(
                              err.message,
                              "error"
                            );

                            button.disabled =
                              false;

                            button.textContent =
                              "Edit";

                          }

                        }
                      );

                    });

                }


                renderRoutes();


                document
                  .getElementById(
                    "transport-route-search"
                  )
                  .addEventListener(
                    "input",
                    event => {

                      renderRoutes(
                        event.target.value
                      );

                    }
                  );


                document
                  .getElementById(
                    "save-transport-settings"
                  )
                  .addEventListener(
                    "click",
                    async () => {

                      const button =
                        document.getElementById(
                          "save-transport-settings"
                        );


                      const payload = {

                        baseDieselPrice:
                          Number(
                            document.getElementById(
                              "transport-base-diesel"
                            ).value
                          ),

                        currentDieselPrice:
                          Number(
                            document.getElementById(
                              "transport-current-diesel"
                            ).value
                          ),

                        truckRatePerTonne:
                          Number(
                            document.getElementById(
                              "transport-truck-rate"
                            ).value
                          ),

                        fuelSensitivity:
                          Number(
                            document.getElementById(
                              "transport-fuel-sensitivity"
                            ).value
                          ),

                        intraStatePerTenBags:
                          Number(
                            document.getElementById(
                              "transport-intra-state"
                            ).value
                          )

                      };


                      try {

                        button.disabled =
                          true;

                        button.textContent =
                          "Saving…";


                        await API.updateTransportSettings(
                          payload
                        );


                        toast(
                          "Transport settings updated."
                        );


                      } catch (err) {

                        toast(
                          err.message,
                          "error"
                        );

                      } finally {

                        button.disabled =
                          false;

                        button.textContent =
                          "Save transport settings";

                      }

                    }
                  );


              } catch (err) {

                console.error(
                  "TRANSPORT ADMIN ERROR:",
                  err
                );


                mount.innerHTML =
                  emptyState(
                    "Couldn't load transport settings",
                    err.message
                  );

              }

            }

          });
        });
      } catch (err) {
        mount.innerHTML += emptyState("Couldn't load sellers", err.message);
      }
    }

    if (user) { loadOverview(); loadOrders(); loadSellers(); }
  </script>
</body>

</html>
