<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your cart — A&amp;S Ventures</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-root-prefix="">
<header id="navbar"></header>

<main>
  <section class="page-hero">
    <div class="container"><h1>Your cart</h1></div>
  </section>

  <section class="section--tight">
    <div class="container">
      <div id="cart-root"></div>
    </div>
  </section>
</main>

<footer id="footer"></footer>

<script src="js/api.js"></script>
<script src="js/extras.js"></script>
<script src="js/ui.js"></script>
<script>
const user = requireAuth("", "Buyer");

function itemHtml(item){
  const p = item.product;
  if (!p) return "";
  const meta = Extras.getProductMeta(p._id);
  const img = (meta && meta.images && meta.images[0]) || p.image;
  const unit = meta && meta.priceUnit ? meta.priceUnit : "unit";
  return `
  <div class="card flex gap-16" style="margin-bottom:14px;align-items:center">
    <div style="width:84px;height:84px;border-radius:10px;overflow:hidden;background:var(--sand);flex-shrink:0">
      ${img ? `<img src="${img}" style="width:100%;height:100%;object-fit:cover">` : ""}
    </div>
    <div style="flex:1">
      <a href="product.html?id=${p._id}" style="font-family:var(--font-display);font-weight:600;color:var(--green-900)">${escapeHtml(p.productName)}</a>
      <div class="muted" style="font-size:.85rem">${formatNaira(p.sellingPrice)} / ${escapeHtml(unit)} · Qty ${item.quantity}</div>
    </div>
    <div style="font-weight:700;color:var(--green-900)">${formatNaira(p.sellingPrice * item.quantity)}</div>
    <button class="icon-btn" data-remove="${item._id}" aria-label="Remove item">Remove</button>
  </div>`;
}

async function loadCart(){
  const root = document.getElementById("cart-root");
  root.innerHTML = `<div class="skeleton" style="height:200px"></div>`;
  try{
    const cart = await API.getCart();
    if (!cart.length){
      root.innerHTML = emptyState("Your cart is empty", "Browse the marketplace and add products you'd like to buy.", "cart");
      root.innerHTML += `<div class="text-center"><a href="marketplace.html" class="btn btn-primary">Explore marketplace</a></div>`;
      return;
    }
    const subtotal = cart.reduce((s,i) => s + (i.product ? i.product.sellingPrice * i.quantity : 0), 0);
    root.innerHTML = `
      <div style="max-width:640px">
        ${cart.map(itemHtml).join("")}
      </div>
      <div class="card" style="max-width:640px;margin-top:20px">
        <div class="flex-between"><span class="muted">Products subtotal</span><strong>${formatNaira(subtotal)}</strong></div>
        <p class="hint" style="margin-top:6px">Delivery fee is calculated at checkout based on your state.</p>
        <a href="checkout.html" class="btn btn-primary btn-block" style="margin-top:14px">Proceed to checkout</a>
      </div>`;
    root.querySelectorAll("[data-remove]").forEach(btn => {
      btn.addEventListener("click", async () => {
        btn.disabled = true;
        try{
          await API.removeFromCart(btn.dataset.remove);
          toast("Removed from cart.");
          loadCart();
        }catch(err){ toast(err.message, "error"); btn.disabled = false; }
      });
    });
  }catch(err){
    root.innerHTML = emptyState("Couldn't load your cart", err.message);
  }
}
if (user) loadCart();
</script>
</body>
</html>
