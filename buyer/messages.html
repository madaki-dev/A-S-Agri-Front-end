<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages — A&amp;S Ventures</title>
<link rel="stylesheet" href="../css/style.css">
<style>
.msg-layout{display:grid;grid-template-columns:280px 1fr;gap:20px;height:70vh;min-height:420px}
.msg-list{border:1px solid var(--line);border-radius:var(--radius-m);overflow-y:auto;background:#fff}
.msg-list button{width:100%;text-align:left;padding:14px;border:none;background:none;border-bottom:1px solid var(--line)}
.msg-list button.active{background:var(--green-050)}
.msg-thread{border:1px solid var(--line);border-radius:var(--radius-m);display:flex;flex-direction:column;background:#fff}
.msg-thread__head{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:600}
.msg-thread__body{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:70%;padding:10px 14px;border-radius:14px;font-size:.9rem}
.bubble.me{align-self:flex-end;background:var(--green-700);color:#fff;border-bottom-right-radius:4px}
.bubble.them{align-self:flex-start;background:var(--sand);border-bottom-left-radius:4px}
.msg-thread__input{display:flex;gap:10px;padding:14px;border-top:1px solid var(--line)}
@media (max-width:760px){.msg-layout{grid-template-columns:1fr;height:auto}.msg-list{max-height:180px}}
</style>
</head>
<body data-root-prefix="../">
<header id="navbar"></header>

<div class="dash">
  <aside class="dash__sidebar" id="dash-sidebar"></aside>
  <div class="dash__main">
    <button class="btn btn-ghost btn-sm mobile-dash-toggle" onclick="toggleDashSidebar()">☰ Menu</button>
    <div class="dash__head"><div><h1>Messages</h1><p class="muted mb-0">Conversations with sellers about products you're interested in.</p></div></div>
    <div id="msg-root"></div>
  </div>
</div>

<footer id="footer"></footer>

<script src="../js/api.js"></script>
<script src="../js/extras.js"></script>
<script src="../js/ui.js"></script>
<script>
const user = requireAuth("../", "Buyer");
const SIDEBAR_LINKS = [
  { href: "dashboard.html", label: "Dashboard" },
  { href: "orders.html", label: "Orders" },
  { href: "favorites.html", label: "Favorites" },
  { href: "messages.html", label: "Messages" },
  { href: "profile.html", label: "Profile & Settings" }
];
if (user) renderDashSidebar(SIDEBAR_LINKS, "messages.html", "");

let activeId = qs("conv");

function renderThread(conv){
  if (!conv){
    return `<div class="msg-thread">${emptyState("Select a conversation", "Pick a conversation on the left to view messages.")}</div>`;
  }
  return `
  <div class="msg-thread">
    <div class="msg-thread__head">${escapeHtml(conv.farmerName)} <span class="muted" style="font-weight:400">· ${escapeHtml(conv.productName)}</span></div>
    <div class="msg-thread__body" id="thread-body">
      ${conv.messages.length ? conv.messages.map(m => `<div class="bubble ${m.from===user._id?"me":"them"}">${escapeHtml(m.text)}</div>`).join("")
        : `<p class="muted text-center">No messages yet. Say hello!</p>`}
    </div>
    <form class="msg-thread__input" id="send-form">
      <input class="input" id="msg-input" placeholder="Write a message…" autocomplete="off">
      <button class="btn btn-primary" type="submit">Send</button>
    </form>
  </div>`;
}

function renderAll(){
  const root = document.getElementById("msg-root");
  const convs = Extras.getConversations(user._id);
  if (!convs.length){
    root.innerHTML = emptyState("No conversations yet", "Contact a seller from a product page to start a conversation.");
    return;
  }
  if (!activeId || !convs.find(c => c.id === activeId)) activeId = convs[0].id;
  const active = convs.find(c => c.id === activeId);

  root.innerHTML = `<div class="msg-layout">
    <div class="msg-list">
      ${convs.map(c => `
        <button data-id="${c.id}" class="${c.id===activeId?"active":""}">
          <strong style="display:block;font-size:.9rem">${escapeHtml(c.farmerName)}</strong>
          <span class="muted" style="font-size:.8rem">${escapeHtml(c.productName)}</span>
        </button>`).join("")}
    </div>
    ${renderThread(active)}
  </div>`;

  root.querySelectorAll("[data-id]").forEach(btn => btn.addEventListener("click", () => { activeId = btn.dataset.id; renderAll(); }));
  const form = document.getElementById("send-form");
  if (form){
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const input = document.getElementById("msg-input");
      if (!input.value.trim()) return;
      Extras.sendMessage(activeId, user._id, input.value.trim());
      input.value = "";
      renderAll();
    });
  }
  const body = document.getElementById("thread-body");
  if (body) body.scrollTop = body.scrollHeight;
}
if (user) renderAll();
</script>
</body>
</html>
