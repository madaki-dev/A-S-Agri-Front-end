<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmer dashboard — A&amp;S Ventures</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body data-root-prefix="../">
  <header id="navbar"></header>

  <div class="dash">
    <aside class="dash__sidebar" id="dash-sidebar"></aside>
    <div class="dash__main">
      <button class="btn btn-ghost btn-sm mobile-dash-toggle" onclick="toggleDashSidebar()">☰ Menu</button>
      <div class="dash__head">
        <div>
          <h1 id="welcome-heading">Welcome back</h1>
          <p class="muted mb-0">Here's how your listings are performing.</p>
        </div>
        <a href="upload-product.html" class="btn btn-primary">+ Add product</a>
      </div>

      <div class="stat-cards" id="stat-cards">
        <div class="stat-card">
          <div class="skeleton" style="height:40px"></div>
        </div>
        <div class="stat-card">
          <div class="skeleton" style="height:40px"></div>
        </div>
        <div class="stat-card">
          <div class="skeleton" style="height:40px"></div>
        </div>
        <div class="stat-card">
          <div class="skeleton" style="height:40px"></div>
        </div>
      </div>

      <div class="flex-between" style="margin-bottom:14px">
        <h3 class="mb-0">Recent orders</h3>
        <a href="orders.html" class="muted" style="font-size:.9rem">View all →</a>
      </div>
      <div id="orders-table"></div>
    </div>
  </div>

  <footer id="footer"></footer>

  <script src="../js/api.js"></script>
  <script src="../js/extras.js"></script>
  <script src="../js/ui.js"></script>
  <script>
    const user = requireAuth("../", "Farmer");

    const SIDEBAR_LINKS = [
      { href: "dashboard.html", label: "Dashboard" },
      { href: "products.html", label: "My Products" },
      { href: "orders.html", label: "Orders" },
      { href: "messages.html", label: "Messages" },
      { href: "upload-product.html", label: "Add Product" },
      { href: "profile.html", label: "Profile & Settings" }
    ];

    function statusBadge(status) {
      return `<span class="badge badge--status-${(status || "pending").toLowerCase()}">${status}</span>`;
    }

    function ordersTableHtml(orders) {
      if (!orders.length) return emptyState("No orders yet", "Orders placed for your products will show up here.");
      return `<div class="table-wrap"><table>
    <thead><tr><th>Order</th><th>Product</th><th>Buyer</th><th>Qty</th><th>You earn</th><th>Status</th></tr></thead>
    <tbody>
      ${orders.slice(0, 8).map(o => `
        <tr>
          <td class="muted">${o.orderId.slice(-6).toUpperCase()}</td>
          <td>${escapeHtml(o.product)}</td>
          <td>${escapeHtml(o.buyer?.fullname || o.buyer?.fullName || "Buyer")}</td>
          <td>${o.quantity}</td>
          <td>${formatNaira(o.farmerPrice * o.quantity)}</td>
          <td>${statusBadge(o.status)}</td>
        </tr>`).join("")}
    </tbody>
  </table></div>`;
    }

    (async function init() {
      if (!user) return;
      document.getElementById("welcome-heading").textContent = `Welcome back, ${user.fullName.split(" ")[0]}`;
      renderDashSidebar(SIDEBAR_LINKS, "dashboard.html", "");

      try {
        const data = await API.getFarmerDashboard();
        const activeListings = (data.products || []).filter(p => p.stock > 0).length;
        document.getElementById("stat-cards").innerHTML = `
      <div class="stat-card"><div class="stat-card__label">Total products</div><div class="stat-card__value">${data.productsUploaded}</div></div>
      <div class="stat-card"><div class="stat-card__label">Active listings</div><div class="stat-card__value">${activeListings}</div></div>
      <div class="stat-card"><div class="stat-card__label">Orders received</div><div class="stat-card__value">${data.ordersReceived}</div></div>
      <div class="stat-card"><div class="stat-card__label">Revenue</div><div class="stat-card__value">${formatNaira(data.revenue)}</div></div>`;
        document.getElementById("orders-table").innerHTML = ordersTableHtml(data.orders || []);
      } catch (err) {
        toast(err.message, "error");
      }
    })();
  </script>
</body>

</html>
