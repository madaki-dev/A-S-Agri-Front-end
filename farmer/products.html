<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Products — A&amp;S Ventures</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-root-prefix="../">
<header id="navbar"></header>

<div class="dash">
  <aside class="dash__sidebar" id="dash-sidebar"></aside>
  <div class="dash__main">
    <button class="btn btn-ghost btn-sm mobile-dash-toggle" onclick="toggleDashSidebar()">☰ Menu</button>
    <div class="dash__head">
      <div><h1>My Products</h1><p class="muted mb-0">Manage everything you have listed on A&amp;S Ventures.</p></div>
      <a href="upload-product.html" class="btn btn-primary">+ Add product</a>
    </div>
    <div id="products-root"><div class="skeleton" style="height:300px"></div></div>
  </div>
</div>

<footer id="footer"></footer>

<script src="../js/api.js"></script>
<script src="../js/extras.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/product-card.js"></script>
<script>
const user = requireAuth("../", "Farmer");
const SIDEBAR_LINKS = [
  { href: "dashboard.html", label: "Dashboard" },
  { href: "products.html", label: "My Products" },
  { href: "orders.html", label: "Orders" },
  { href: "messages.html", label: "Messages" },
  { href: "upload-product.html", label: "Add Product" },
  { href: "profile.html", label: "Profile & Settings" }
];

function rowHtml(p){
  const meta = Extras.getProductMeta(p._id);
  const img = (meta && meta.images && meta.images[0]) || p.image;
  return `<tr>
    <td><div class="flex gap-12" style="align-items:center">
      <div style="width:44px;height:44px;border-radius:8px;overflow:hidden;background:var(--sand);flex-shrink:0">${img?`<img src="${img}" style="width:100%;height:100%;object-fit:cover">`:""}</div>
      <span>${escapeHtml(p.productName)}</span>
    </div></td>
    <td>${escapeHtml(p.category)}</td>
    <td>${formatNaira(p.sellingPrice)}${meta?.priceUnit ? " / "+escapeHtml(meta.priceUnit) : ""}</td>
    <td>${p.stock}</td>
    <td>
      <div class="flex gap-8">
        <a href="../product.html?id=${p._id}" class="icon-btn">View</a>
        <button class="icon-btn" data-delete="${p._id}">Delete</button>
      </div>
    </td>
  </tr>`;
}

async function load(){
  const root = document.getElementById("products-root");
  try{
    const data = await API.getFarmerDashboard();
    const mine = data.products || [];
    if (!mine.length){
      root.innerHTML = emptyState("No products yet", "List your first agricultural product to start reaching buyers.");
      root.innerHTML += `<div class="text-center"><a href="upload-product.html" class="btn btn-primary">Add your first product</a></div>`;
      return;
    }
    root.innerHTML = `<div class="table-wrap"><table>
      <thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Actions</th></tr></thead>
      <tbody>${mine.map(rowHtml).join("")}</tbody>
    </table></div>`;
    root.querySelectorAll("[data-delete]").forEach(btn => {
      btn.addEventListener("click", async () => {
        if (!confirm("Delete this product? This can't be undone.")) return;
        btn.disabled = true;
        try{ await API.deleteProduct(btn.dataset.delete); toast("Product deleted."); load(); }
        catch(err){ toast(err.message, "error"); btn.disabled = false; }
      });
    });
  }catch(err){
    root.innerHTML = emptyState("Couldn't load your products", err.message);
  }
}
if (user){ renderDashSidebar(SIDEBAR_LINKS, "products.html", ""); load(); }
</script>
</body>
</html>
