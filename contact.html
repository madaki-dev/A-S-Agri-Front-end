<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — A&amp;S Agri</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body data-root-prefix="">
  <header id="navbar"></header>

  <main>
    <section class="page-hero">
      <div class="container">
        <h1>Get in touch</h1>
        <p class="lede mb-0">Questions about buying, selling, or partnering with A&amp;S Agri? We'd love to hear
          from you.</p>
      </div>
    </section>

    <section class="section--tight">
      <div class="container split-panel" style="grid-template-columns:1.3fr 1fr;align-items:flex-start">
        <form id="contact-form" class="card" novalidate>
          <div class="field" id="f-name"><label for="name">Name</label><input id="name" class="input" required></div>
          <div class="field" id="f-email"><label for="email">Email</label><input id="email" type="email" class="input"
              required></div>
          <div class="field"><label for="subject">Subject</label><input id="subject" class="input"
              placeholder="What's this about?"></div>
          <div class="field" id="f-message"><label for="message">Message</label><textarea id="message" class="input"
              required></textarea></div>
          <button type="submit" class="btn btn-primary btn-block" id="send-btn">Send message</button>
        </form>

        <div class="card">
          <h3>Reach us directly</h3>
          <p class="muted" style="font-size:.9rem">
            <span style="display:inline-flex;vertical-align:-2px;margin-right:4px">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
                <path
                  d="M12 2.5a9.5 9.5 0 0 0-8.2 14.3L2.5 21.5l4.8-1.26A9.5 9.5 0 1 0 12 2.5zm5.4 13.6c-.23.65-1.32 1.24-1.9 1.32-.5.08-1.05.11-1.7-.1-.4-.13-.9-.3-1.56-.58-2.75-1.19-4.55-3.99-4.68-4.18-.14-.18-1.1-1.47-1.1-2.8 0-1.34.7-1.99.95-2.26.24-.28.53-.34.7-.34h.51c.16 0 .38-.03.6.45.23.51.77 1.77.83 1.9.07.13.11.28.02.45-.09.18-.14.28-.27.43-.14.16-.28.35-.4.47-.13.13-.27.28-.12.55.16.28.7 1.19 1.53 1.94 1.05.95 1.95 1.24 2.22 1.38.28.14.44.12.6-.06.17-.19.72-.85.91-1.14.19-.28.38-.24.63-.14.26.09 1.65.79 1.93.93.28.14.47.21.54.32.07.13.07.72-.16 1.38z" />
              </svg>
            </span>
            WhatsApp:
            <a href="https://wa.me/2348023799337" style="color:var(--green-700)">
              +234 802 379 9337
            </a>
          </p>

          <p class="muted" style="font-size:.9rem"><span
              style="display:inline-flex;vertical-align:-2px;margin-right:4px"><svg viewBox="0 0 24 24" width="14"
                height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                stroke-linejoin="round">
                <rect x="3" y="5" width="18" height="14" rx="2" />
                <path d="M4 6.5l8 6 8-6" />
              </svg></span>Email: <a href="mailto:hello@asventures.ng"
              style="color:var(--green-700)">as.logistics.td@gmail.com</a></p>
          <p class="muted" style="font-size:.9rem"><span
              style="display:inline-flex;vertical-align:-2px;margin-right:4px"><svg viewBox="0 0 24 24" width="14"
                height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                stroke-linejoin="round">
                <path
                  d="M4.5 4h3.6l1.4 4.2-2.1 1.5a12.5 12.5 0 0 0 6.9 6.9l1.5-2.1L20 15.9v3.6c0 .8-.7 1.4-1.5 1.3C9.4 19.9 4.1 14.6 3.2 5.5 3.1 4.7 3.7 4 4.5 4z" />
              </svg></span>Phone: +234 904 326 8594</p>
          <p class="muted" style="font-size:.9rem"><span
              style="display:inline-flex;vertical-align:-2px;margin-right:4px"><svg viewBox="0 0 24 24" width="14"
                height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M12 21s-6.5-5.6-6.5-11A6.5 6.5 0 0 1 18.5 10c0 5.4-6.5 11-6.5 11z" />
                <circle cx="12" cy="10" r="2.3" />
              </svg></span>Location: Abuja, Nigeria</p>
        </div>
      </div>
    </section>
  </main>

  <footer id="footer"></footer>
  <script src="js/api.js"></script>
  <script src="js/extras.js"></script>
  <script src="js/ui.js"></script>
  <script>
    document.getElementById("contact-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const subject = document.getElementById("subject").value.trim();
      const message = document.getElementById("message").value.trim();

      let ok = true;
      const check = (id, valid) => { document.getElementById(id).classList.toggle("has-error", !valid); ok = ok && valid; };
      check("f-name", !!name);
      check("f-email", /\S+@\S+\.\S+/.test(email));
      check("f-message", !!message);
      if (!ok) return;

      const btn = document.getElementById("send-btn");
      btn.disabled = true; btn.textContent = "Sending…";
      try {
        await API.sendContact({ name, email, subject, message });
        toast("Your message has been sent.");
        document.getElementById("contact-form").reset();
      } catch (err) {
        toast(err.message, "error");
      } finally {
        btn.disabled = false; btn.textContent = "Send message";
      }
    });
  </script>
</body>

</html>
